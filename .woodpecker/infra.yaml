# The infra types and manifest tests, the `infra` job of
# .github/workflows/ci.yml on Woodpecker (pilot, docs/contributing/woodpecker.md).
# No stack credentials: preview and policy checks stay in deploy.yml. Not yet
# here: the change filter.
when:
  - event: pull_request
    branch: [develop, "release/**", "claude/**"]
  - event: push
    branch: [develop, "release/**"]

# The agents that take it: docs/contributing/woodpecker.md, "Agents".
labels:
  pool: ci

steps:
  - name: checks
    image: node:22-bookworm
    commands:
      - sh ci/woodpecker_setup.sh bun
      - task ci:infra
