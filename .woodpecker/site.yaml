# The website, the `site` job of .github/workflows/ci.yml on Woodpecker (pilot,
# docs/contributing/woodpecker.md). Not yet here: the change filter.
when:
  - event: pull_request
    branch: [develop, "release/**", "claude/**"]
  - event: push
    branch: [develop, "release/**"]

# The agents that take it: docs/contributing/woodpecker.md, "Agents".
labels:
  pool: ci

steps:
  # Root in the step's container, so website:a11y:deps installs Chromium's
  # system libraries with apt and without sudo.
  - name: checks
    image: node:22-bookworm
    commands:
      - sh ci/woodpecker_setup.sh bun
      - task ci:site
