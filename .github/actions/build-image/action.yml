name: Build image
description: >-
  Build one of the three images (backend, frontend, web) from an entry of the
  plan `ci/image_inputs.py` writes, and push it under its content tag
  `inputs-<hash>` when asked to, through `task image:build` / `image:push`
  (ci/build_image.py), the build Woodpecker runs too. The commit's own tags
  (`sha-<commit>`, `latest`) are never set here: CI's publish job adds them
  once every check on the commit has passed.

inputs:
  name:
    description: backend, frontend or web
    required: true
  hash:
    description: The input hash from the plan
    required: true
  registry:
    description: Lowercase registry prefix, e.g. ghcr.io/archos-at
    required: true
  push:
    description: >-
      "true" pushes the image and writes the layer cache, which needs a token
      with `packages: write`. Anything else builds only.
    required: false
    default: "false"
  posthog-api-key:
    description: >-
      A PostHog personal API key (`error_tracking:write`, `organization:read`).
      With `posthog-project-id` it makes the frontend build upload its source
      maps to PostHog, as the BuildKit secret `posthog_cli_api_key` (never a
      build arg, which would be written into the image history). Empty, as it
      is for a fork or a repository without the secret, builds as before. Only
      the frontend image reads it.
    required: false
    default: ""
  posthog-project-id:
    description: The PostHog project the source maps belong to. Not secret.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No cleanup: removing the builder deletes its state on a runner that is
    # discarded right after, and took 52s of the frontend image job (the
    # longest job in a pull request run) on 2026-10-09.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        cleanup: false

    # Also needed to build only: the layer cache is read from GHCR.
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - uses: ./.github/actions/setup-task

    # The OCI labels from the repository GitHub knows (title, description,
    # source, licenses) plus created, revision and version. No `images`: the
    # tag is ci/build_image.py's.
    - name: Labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        tags: type=raw,value=inputs-${{ inputs.hash }}

    # ci/build_image.py's docstring says why the layer cache is in GHCR, and why
    # only a push writes it. Rather than type=gha: three mode=max caches
    # (3-5 GB) LRU-evicted each other and every other cache out of the
    # repository's 10 GB Actions budget, and re-exporting them through the cache
    # API left publishes hanging for half an hour.
    #
    # GIT_SHA is the commit that BUILT the image. An image whose inputs did not
    # change is not rebuilt, only re-tagged, so a container reports the commit
    # its code came from, which is the one worth reading in a pilot report. It is
    # also the PostHog release of the frontend's source maps, so an error's
    # release is the commit the running container names.
    #
    # PROVENANCE is the attestation docker/build-push-action added before this
    # step ran the task: max for a public repository, min for a private one,
    # with the run as builder id.
    #
    # The PostHog key goes straight from the input to the environment, where
    # buildx reads it as a BuildKit secret; a step output may refuse to carry a
    # value the runner knows to be a secret. Source maps go to PostHog from the
    # frontend build only, and only when both halves are configured.
    - name: Build${{ inputs.push == 'true' && ' and push' || '' }}
      shell: bash
      env:
        TARGET: ${{ inputs.push == 'true' && 'image:push' || 'image:build' }}
        IMAGE_NAME: ${{ inputs.name }}
        IMAGE_HASH: ${{ inputs.hash }}
        REGISTRY: ${{ inputs.registry }}
        GIT_SHA: ${{ github.sha }}
        IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        PROVENANCE: ${{ github.event.repository.private && 'mode=min,inline-only=true' || 'mode=max' }},builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        POSTHOG_API_KEY: ${{ inputs.posthog-api-key }}
        POSTHOG_PROJECT_ID: ${{ inputs.posthog-project-id }}
      run: task "$TARGET" NAME="$IMAGE_NAME"
