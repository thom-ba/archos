# Infra tier (deploy/pulumi).
#
# Included by the root Taskfile.yml with `flatten: true`: task names stay literal
# (`infra:types`). Shared vars (UI, SITE, PY, ...) and env live in the root file.

version: '3'

tasks:
  # ── infra (deploy/pulumi) ───────────────────────────────────────────────────

  infra:install:
    desc: Install the Pulumi program's and its policy pack's dependencies (two lockfiles)
    cmds:
      # Two Node programs under deploy/pulumi, each with its own lockfile: the
      # Pulumi program itself (which `infra:types` typechecks and `infra:test`
      # runs) and the CrossGuard policy pack beside it. Installing only the
      # policy pack left a fresh clone failing `infra:types`, because the
      # program's own TypeScript and Vitest were never fetched.
      - bun install --frozen-lockfile --cwd deploy/pulumi
      - bun install --frozen-lockfile --cwd deploy/pulumi/policy

  infra:types:
    desc: Typecheck the Pulumi program and its policy pack
    cmds:
      - bun run --cwd deploy/pulumi typecheck
      - bun run --cwd deploy/pulumi/policy typecheck

  infra:test:
    desc: Manifest tests for the Pulumi program (no cluster, no stack credentials)
    # `typecheck` proves the program is well-typed; it proves nothing about the
    # manifests, which is where every SeaweedFS bug in this repo's history has
    # lived — a renamed flag, a Service missing the gRPC port `weed shell`
    # needs, a liveness probe pointed at an endpoint that answers 423. All
    # string-valued, all invisible to tsc. These run the program under
    # `pulumi.runtime.setMocks` and assert the resource inputs directly.
    # OTELCOL_BIN (env or var): the otelcol-contrib binary collector-validate.spec.ts
    # runs every rendered collector config through; without it that spec is
    # skipped. ci/install_otelcol.sh installs it, `task ci:infra` passes it.
    env:
      OTELCOL_BIN: '{{.OTELCOL_BIN}}'
    cmds:
      - bun run --cwd deploy/pulumi test

  # The Infra job of .github/workflows/ci.yml in one target, for a CI without
  # its steps and for a local run. Actions runs the same commands as steps.
  # What can run on an untrusted PR: the types (every CRD `spec`, and the
  # policy pack) and the manifests under `pulumi.runtime.setMocks`. `pulumi
  # preview`, CRD schema validation and CrossGuard need stack credentials and
  # run in deploy.yml.
  ci:infra:
    desc: 'CI: the Infra job: install, typecheck, and the manifest tests with otelcol-contrib validate'
    vars:
      OTELCOL_BIN:
        sh: bash ci/install_otelcol.sh tmp/otelcol
    cmds:
      - task: infra:install
      - task: infra:types
      - task: infra:test
        vars: {OTELCOL_BIN: '{{.OTELCOL_BIN}}'}

  infra:preview:
    desc: 'Pulumi preview (needs stack credentials)'
    dir: deploy/pulumi
    cmds:
      - bun run preview

  infra:deploy:dev:
    desc: 'Deploy the dev (staging) stack from this checkout (CI only: needs PULUMI_ACCESS_TOKEN and GH_TOKEN)'
    # deploy.yml's staging job as one script, for a CI without its steps (the
    # Woodpecker pilot, docs/contributing/woodpecker.md). Dev only: the script
    # fixes the stack. It applies, so it is never part of a verify target.
    cmds:
      - task: infra:deploy:dev:prepare
      - task: infra:deploy:dev:apply

  # The two halves, for a CI that keeps installers away from the tokens: the
  # prepare step runs every installer and reads no secret, the apply step gets
  # the tokens and installs nothing (.woodpecker/deploy-dev.yaml).
  infra:deploy:dev:prepare:
    desc: 'Dev deploy, part 1: install both lockfiles, typecheck, install the Pulumi CLI (reads no secret)'
    cmds:
      - task: infra:install
      - task: infra:types
      - bash deploy/pulumi/scripts/deploy-dev.sh --prepare

  infra:deploy:dev:apply:
    desc: 'Dev deploy, part 2: the gates, preview and up (CI only: needs PULUMI_ACCESS_TOKEN and GH_TOKEN)'
    cmds:
      - bash deploy/pulumi/scripts/deploy-dev.sh
